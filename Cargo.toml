[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
modulo_arithmetic = "warn"
redundant_clone = "warn"
unused_async = "warn"
if_not_else = "warn"
cognitive_complexity = "allow"
too_many_arguments = "warn"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
authors = ["Wyatt Au"]
license = "Apache-2.0"
description = "Snapshot, store, and score any counter: subjects, observations, clamped velocity"
repository = "https://github.com/WyattAu/signalkit"
homepage = "https://github.com/WyattAu/signalkit"
readme = "README.md"
keywords = ["metrics", "velocity", "trends", "analytics", "sqlite"]
categories = ["development-tools", "database"]

[workspace.dependencies]
signalkit-core = { path = "crates/signalkit-core", version = "0.1.0" }
signalkit-integrity = { path = "crates/signalkit-integrity", version = "0.2.0" }
clock-kit = "0.1"
fetch-kit = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
